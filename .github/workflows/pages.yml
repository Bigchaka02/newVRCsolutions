# Publishes the static storefront to GitHub Pages on every push to main.
# The redesign branch, when it exists, is built alongside it at /v2/ so both
# versions can be open side by side.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Pages hosts only the static site; checkout, contact and order lookup need the
# API (see README > Deploy).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: python3 build.py --base-path "${{ steps.pages.outputs.base_path }}"
      - name: Look for the redesign branch
        id: v2
        run: |
          if git ls-remote --exit-code --heads origin redesign > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.v2.outputs.exists == 'true'
        with:
          ref: redesign
          path: v2src
      - name: Build the redesign at /v2/
        if: steps.v2.outputs.exists == 'true'
        run: |
          cd v2src
          python3 build.py --base-path "${{ steps.pages.outputs.base_path }}/v2"
          cp -r public ../public/v2
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
